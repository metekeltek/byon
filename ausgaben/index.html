<style>
  /* Das Blatt ist fuer die Mail auf feste 600 Pixel gesetzt — Postfaecher
     rechnen mit Tabellen, nicht mit Prozenten. Im Browser ist das auf einem
     Telefon zu breit: 600 Pixel auf einem 390 Pixel breiten Schirm, also
     zoomt das Geraet die ganze Seite heraus, bis sie hineinpasst. Der
     bestehende max-width:620px-Block der Mail aendert nur die Innenabstaende,
     nicht die Tabellenbreite. Hier wird sie fluessig. */
  @media (max-width: 620px) {
    table.sheet { width: 100% !important; max-width: 100% !important; }

    /* Die Schriftgroessen sind fuer ein 600 Pixel breites Blatt gesetzt.
       Solange die Seite herausgezoomt war, fiel das nicht auf; seit sie
       die volle Breite bekommt, steht dieselbe Schrift auf 390 Pixeln und
       wirkt zu gross. Nur hier verkleinert — die Mail behaelt ihre
       Groessen, die waren ausdruecklich so gewuenscht.
       Die Stufen bleiben erhalten: Aufmacher groesser als der Rest. */
    .schlag   { font-size: 18px !important; line-height: 25px !important; }
    .fliess   { font-size: 15px !important; line-height: 24px !important; }
    .herkunft { font-size: 13px !important; line-height: 19px !important; }
  }
  @media (min-width: 1000px) {
    table.sheet { width: min(94vw, 1180px) !important; max-width: none !important; }
    .pad  { padding-left: 62px !important; padding-right: 62px !important; }
    .padl { padding-left: 62px !important; }
    .padr { padding-right: 62px !important; }
    .ink, .muted, .quote { max-width: 46em; }
  }
  @media (min-width: 1700px) {
    table.sheet { width: min(88vw, 1380px) !important; }
    .pad  { padding-left: 84px !important; padding-right: 84px !important; }
    .padl { padding-left: 84px !important; }
    .padr { padding-right: 84px !important; }
  }
</style>
